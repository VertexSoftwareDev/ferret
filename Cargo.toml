[workspace]
resolver = "2"
members = ["crates/ferret-core", "crates/ferret-cli", "crates/ferret-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
