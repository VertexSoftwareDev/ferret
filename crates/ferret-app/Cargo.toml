[package]
name = "ferret-app"
description = "Ferret desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ferret-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ferret-core = { path = "../ferret-core" }
ferret-shell = { path = "../ferret-shell" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

