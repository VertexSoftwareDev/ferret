<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferret</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand" title="Ferret">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M15.8 15.8 L21 21" />
        </svg>
        <span>Ferret</span>
      </div>

      <div class="search-wrap">
        <input
          id="query"
          type="search"
          autocomplete="off"
          spellcheck="false"
          data-i18n-placeholder="searchPlaceholder"
          data-i18n-aria="searchLabel"
        />
        <kbd class="hint">Ctrl+F</kbd>
      </div>

      <select id="drive" data-i18n-aria="driveLabel"></select>

      <select id="lang" data-i18n-aria="languageLabel">
        <option value="tr">TR</option>
        <option value="en">EN</option>
      </select>

      <button id="rescan" class="ghost" data-i18n-title="rescanTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 5v6h-6" />
        </svg>
      </button>

      <button id="theme" class="ghost" data-i18n-title="themeTitle"></button>
    </header>

    <nav class="filters">
      <label class="chip">
        <input type="checkbox" id="f-files" />
        <span data-i18n="filesOnly"></span>
      </label>
      <label class="chip">
        <input type="checkbox" id="f-dirs" />
        <span data-i18n="dirsOnly"></span>
      </label>
      <label class="chip">
        <input type="checkbox" id="f-hidden" checked />
        <span data-i18n="skipHidden"></span>
      </label>
      <label class="chip">
        <span data-i18n="atLeast"></span>
        <select id="f-size">
          <option value="">—</option>
          <option value="1048576">1 MB</option>
          <option value="10485760">10 MB</option>
          <option value="104857600">100 MB</option>
          <option value="1073741824">1 GB</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span id="notice" class="notice" hidden></span>
    </nav>

    <main class="table" id="table">
      <div class="thead" role="row">
        <button class="th col-name" data-sort="name" role="columnheader" data-i18n="colName"></button>
        <button class="th col-path" data-sort="path" role="columnheader" data-i18n="colPath"></button>
        <button class="th col-kind" role="columnheader" data-i18n="colKind"></button>
        <button class="th col-size" data-sort="size" role="columnheader" data-i18n="colSize"></button>
        <button class="th col-date" data-sort="modified" role="columnheader" data-i18n="colDate"></button>
      </div>

      <div class="viewport" id="viewport" tabindex="0">
        <div class="sizer" id="sizer"></div>
        <div class="rows" id="rows"></div>
      </div>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="spinner" id="spinner"></div>
          <p id="overlay-title"></p>
          <p id="overlay-detail" class="muted"></p>
          <button id="overlay-action" class="primary" hidden></button>
        </div>
      </div>
    </main>

    <footer class="status">
      <span id="count">—</span>
      <span class="spacer"></span>
      <span id="volume-info" class="muted"></span>
    </footer>

    <div class="menu" id="menu" hidden>
      <button data-action="open" data-i18n="menuOpen"></button>
      <button data-action="reveal" data-i18n="menuReveal"></button>
      <button data-action="copy" data-i18n="menuCopy"></button>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
